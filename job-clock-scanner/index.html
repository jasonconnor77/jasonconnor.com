<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>Bunting Bearings — Job Clock Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{--bg:#05070b;--panel:#121827;--gold:#d4af37;--gold2:#f9eebc;--text:#fff;--muted:#cbd5e1;--green:#22c55e;--red:#ef4444;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}body{padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
    .shell{height:100%;display:flex;flex-direction:column}.top{padding:14px 16px 12px;border-bottom:1px solid rgba(255,255,255,.12);background:#090d15;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{min-width:0}.eyebrow{font-size:11px;font-weight:1000;letter-spacing:1.7px;color:var(--gold2)}h1{margin:3px 0 0;font-size:20px;line-height:1.1;font-weight:1000}.close{width:46px;height:46px;flex:0 0 46px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:#fff;font-size:22px;font-weight:900}
    .intro{padding:12px 16px 10px}.intro strong{display:block;font-size:17px}.intro span{display:block;margin-top:3px;color:var(--muted);font-size:13px;font-weight:750}
    .camera{flex:1;min-height:0;background:#000;position:relative;overflow:hidden}.camera video{width:100%;height:100%;object-fit:cover;background:#000}.scanGuide{position:absolute;left:5%;right:5%;top:50%;transform:translateY(-50%);height:145px;border:3px solid var(--gold);border-radius:18px;pointer-events:none;z-index:20;box-shadow:0 0 0 9999px rgba(0,0,0,.15);display:none}.scanGuide.show{display:block}.laser{position:absolute;left:3%;right:3%;top:50%;height:2px;background:#ef4444;box-shadow:0 0 10px #ef4444;animation:sweep .95s ease-in-out infinite alternate}@keyframes sweep{from{transform:translateY(-48px)}to{transform:translateY(48px)}}
    .idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#94a3b8;font-weight:850;font-size:15px}.idle.hidden{display:none}.bottom{padding:12px 16px calc(14px + var(--safe-bottom));background:#090d15;border-top:1px solid rgba(255,255,255,.12)}.status{min-height:48px;border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 13px;font-size:14px;font-weight:900;color:var(--muted)}.status.good{border:1px solid rgba(34,197,94,.55);color:#dcfce7}.status.bad{border:1px solid rgba(239,68,68,.55);color:#fee2e2}.start{width:100%;min-height:66px;border:0;border-radius:17px;margin-top:10px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#111827;font-size:20px;font-weight:1000;letter-spacing:.3px;box-shadow:0 12px 30px rgba(0,0,0,.35)}.start:disabled{opacity:.55}.hidden{display:none!important}.manual{margin-top:9px;text-align:center;font-size:12px;color:#94a3b8;font-weight:750}
    #fallbackReader{position:absolute;inset:0;background:#000;display:none}#fallbackReader.active{display:block}#fallbackReader video{object-fit:cover!important}
  </style>
</head>
<body>
<div class="shell">
  <div class="top"><div class="brand"><div class="eyebrow">BUNTING BEARINGS</div><h1 id="title">JOB CLOCK SCANNER</h1></div><button id="closeBtn" class="close" type="button" aria-label="Close">✕</button></div>
  <div class="intro"><strong id="instruction">Point the rear camera at the barcode.</strong><span>Hold the barcode inside the gold box. It returns automatically when read.</span></div>
  <div class="camera" id="cameraWrap">
    <video id="video" playsinline muted></video>
    <div id="fallbackReader"></div>
    <div id="idleMessage" class="idle">CAMERA IS OFF<br><br>Tap OPEN CAMERA &amp; SCAN NOW.</div>
    <div id="scanGuide" class="scanGuide"><div class="laser"></div></div>
  </div>
  <div class="bottom"><div id="status" class="status">READY TO SCAN</div><button id="startBtn" class="start" type="button">OPEN CAMERA &amp; SCAN NOW</button><div class="manual">Fast live 1D barcode scanner — no picture required.</div></div>
</div>
<script>
(function(){
'use strict';
const qs=new URLSearchParams(location.search);
const target=(qs.get('target')||'badge').toLowerCase()==='shop'?'shop':'badge';
const token=qs.get('token')||'';
const title=document.getElementById('title'), instruction=document.getElementById('instruction'), status=document.getElementById('status'), startBtn=document.getElementById('startBtn'), closeBtn=document.getElementById('closeBtn'), idle=document.getElementById('idleMessage'), guide=document.getElementById('scanGuide'), video=document.getElementById('video'), fallbackReader=document.getElementById('fallbackReader');
let stream=null, scanner=null, detector=null, running=false, finished=false, loopHandle=0, lastDetectAt=0;
title.textContent=target==='badge'?'SCAN EMPLOYEE BADGE':'SCAN SHOP ORDER';
instruction.textContent=target==='badge'?'Point the rear camera at the employee badge barcode.':'Point the rear camera at the shop order barcode.';
function setStatus(text,kind){status.textContent=text;status.classList.remove('good','bad');if(kind)status.classList.add(kind)}
function normalizeShopReturn(raw){
  const s=String(raw||'').trim().toUpperCase();
  let m=s.match(/^([A-Z]?\d{1,12})\s*[.\-\/\s]\s*(\d{1,3})$/);
  if(m) return `${m[1]}-${String(m[2]).padStart(3,'0')}`;
  const c=s.replace(/[^A-Z0-9]/g,'');
  if(/^\d{9}$/.test(c)) return `${c.slice(0,6)}-${c.slice(6)}`;
  if(/^[A-Z]\d{9}$/.test(c)) return `${c.slice(0,-3)}-${c.slice(-3)}`;
  return s;
}
function sendResult(value){
  if(finished)return;finished=true;
  const out=target==='shop'?normalizeShopReturn(value):String(value||'').trim();
  try{if(window.opener&&!window.opener.closed)window.opener.postMessage({source:'BUNTING_JOB_CLOCK_SCANNER',barcode:out,target,token},'*')}catch(_){}
  setStatus('BARCODE READ — RETURNING TO JOB CLOCK…','good');
  if(navigator.vibrate)try{navigator.vibrate(55)}catch(_){}
  stop().finally(()=>setTimeout(()=>{try{window.close()}catch(_){};setTimeout(()=>setStatus('SCAN COMPLETE. RETURN TO JOB CLOCK.','good'),600)},120));
}
async function stop(){
  running=false;if(loopHandle){cancelAnimationFrame(loopHandle);loopHandle=0}
  if(scanner){try{await scanner.stop()}catch(_){}try{await scanner.clear()}catch(_){}scanner=null}
  if(stream){try{stream.getTracks().forEach(t=>t.stop())}catch(_){}stream=null}
  video.srcObject=null;fallbackReader.classList.remove('active');guide.classList.remove('show');idle.classList.remove('hidden');
}
async function fastNativeStart(){
  if(!navigator.mediaDevices?.getUserMedia || typeof BarcodeDetector==='undefined') return false;
  let supported=[];try{supported=await BarcodeDetector.getSupportedFormats()}catch(_){return false}
  const wanted=['code_128','code_39','code_93','itf'].filter(x=>supported.includes(x));
  if(!wanted.length)return false;
  detector=new BarcodeDetector({formats:wanted});
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
  video.srcObject=stream;await video.play();running=true;idle.classList.add('hidden');guide.classList.add('show');setStatus('SCANNING — HOLD BARCODE INSIDE THE GOLD BOX.');
  const scanFrame=async(ts)=>{
    if(!running||finished)return;
    if(ts-lastDetectAt>=45 && video.readyState>=2){
      lastDetectAt=ts;
      try{const codes=await detector.detect(video);if(codes?.length&&codes[0]?.rawValue){sendResult(codes[0].rawValue);return}}catch(_){}
    }
    loopHandle=requestAnimationFrame(scanFrame);
  };
  loopHandle=requestAnimationFrame(scanFrame);
  return true;
}
async function fallbackStart(){
  if(typeof Html5Qrcode==='undefined')throw new Error('BARCODE SCANNER LIBRARY DID NOT LOAD.');
  fallbackReader.classList.add('active');video.style.display='none';
  scanner=new Html5Qrcode('fallbackReader',{useBarCodeDetectorIfSupported:true,formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.CODE_93]});
  await scanner.start({facingMode:'environment'},{fps:25,qrbox:(w,h)=>({width:Math.max(250,Math.min(w*.94,620)),height:120}),disableFlip:false},decoded=>sendResult(decoded),()=>{});
  running=true;idle.classList.add('hidden');guide.classList.add('show');setStatus('SCANNING — HOLD BARCODE INSIDE THE GOLD BOX.');
}
function cameraErrorMessage(err){const name=String(err?.name||''),msg=String(err?.message||err||'').trim();if(name==='NotAllowedError'||/permission|denied|not allowed/i.test(msg))return'CAMERA ACCESS IS BLOCKED. ALLOW CAMERA FOR THIS SITE AND TRY AGAIN.';if(name==='NotReadableError'||/busy|in use|not readable/i.test(msg))return'CAMERA IS BUSY. CLOSE OTHER CAMERA APPS AND TRY AGAIN.';return(msg||'CAMERA COULD NOT START.')+' TRY AGAIN.'}
async function start(){
  if(running||finished)return;startBtn.disabled=true;startBtn.textContent='OPENING CAMERA…';setStatus('OPENING REAR CAMERA…');video.style.display='block';
  try{let ok=false;try{ok=await fastNativeStart()}catch(e){console.warn('Fast scanner unavailable',e);await stop()}
    if(!ok)await fallbackStart();startBtn.classList.add('hidden');
  }catch(err){console.error(err);await stop();setStatus(cameraErrorMessage(err),'bad');startBtn.disabled=false;startBtn.textContent='OPEN CAMERA & SCAN NOW';startBtn.classList.remove('hidden')}
}
closeBtn.addEventListener('click',()=>stop().finally(()=>{try{window.close()}catch(_){history.back()}}));startBtn.addEventListener('click',start);window.addEventListener('pagehide',()=>stop());window.addEventListener('beforeunload',()=>stop());
})();
</script>
</body>
</html>
